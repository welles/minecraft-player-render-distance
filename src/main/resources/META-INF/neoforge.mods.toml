license = "MIT"

modLoader = "javafml"
loaderVersion = "[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "Nico Welles"
description = "See the other players on the server far beyond the view distance: the server sends them from much further away and the client draws them even where no chunks are loaded."
${icon}File = "assets/${id}/icon.png"
# pixel art, scaled without smoothing
${icon}Blur = false

[[mixins]]
config = "playerrenderdistance.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
